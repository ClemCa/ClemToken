name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Golden tests
        shell: bash
        run: |
          dotnet run -c Release -- test generator test_generator.txt
          dotnet run -c Release -- test parser test_parser.txt test_grammar.ct
      - name: CLI smoke tests
        shell: bash
        run: |
          dotnet run -c Release -- --version
          dotnet run -c Release -- build test_grammar.ct -o test_generated.at
          dotnet run -c Release -- parse test_generated.at test_code.txt
          dotnet run -c Release -- parse test_generated.at test_code.txt --format json
          dotnet run -c Release -- tokens test_generated.at test_code.txt
          dotnet run -c Release -- analyze test_grammar.ct --json
          dotnet run -c Release -- profile test_generated.at test_code.txt --json
      - name: Exit codes
        shell: bash
        run: |
          run_expect() {
            expected=$1
            shift
            if "$@" >/dev/null 2>&1; then actual=0; else actual=$?; fi
            if [ "$actual" -ne "$expected" ]; then
              echo "expected exit $expected, got $actual: $*" >&2
              exit 1
            fi
          }
          run_expect 2 dotnet run -c Release -- bogus
          run_expect 1 dotnet run -c Release -- parse missing.cta test_code.txt
          dotnet run -c Release -- build test_grammar.ct -o test_generated.at
          printf 'garbage !!!\n' > bad.txt
          run_expect 1 dotnet run -c Release -- parse test_generated.at bad.txt
          run_expect 0 dotnet run -c Release -- parse test_generated.at bad.txt --allow-errors
